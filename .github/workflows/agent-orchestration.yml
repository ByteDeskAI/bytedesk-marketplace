name: agent-orchestration

on:
  push:
    paths:
      - "agent-orchestration/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/agent-orchestration.yml"
  pull_request:
    paths:
      - "agent-orchestration/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/agent-orchestration.yml"

jobs:
  test-build-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-orchestration/package-lock.json
      - name: Install sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap slirp4netns
      - name: Install build dependencies
        run: npm ci --prefix agent-orchestration --ignore-scripts
      - name: Verify plugin-local design system (offline)
        run: npm run design-system:check --prefix agent-orchestration
      - name: Unit tests
        run: npm test --prefix agent-orchestration
      - name: Rebuild tracked artifacts
        run: npm run build --prefix agent-orchestration
      - name: Tracked bundle drift
        run: git diff --exit-code -- agent-orchestration/dist
      - name: Clean installed-cache contract
        run: npm run test:contract --prefix agent-orchestration
      - name: Manifest contracts
        run: |
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("agent-orchestration/.codex-plugin/plugin.json")); if("version" in c) process.exit(1)'
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("agent-orchestration/.claude-plugin/plugin.json")); if("version" in c) process.exit(1)'
