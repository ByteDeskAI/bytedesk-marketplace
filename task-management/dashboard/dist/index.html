<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>task-management board</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The manifest carries one theme colour; the window chrome follows the OS
         the way the board's Atlassian tokens already do. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0052CC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1D2125" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { min-height: 100%; }
      /* Atlassian Sans is a design token, not a webfont request — a strict CSP allows no CDN. */
      body {
        font-family: var(--ds-font-family-body, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
        background: var(--ds-surface, #fff);
        color: var(--ds-text, #172b4d);
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font-family: inherit; font-size: inherit; }

      /*
       * Motion as information (TM-040). Two jobs: show that work is happening, and show that
       * something changed. Defined here because keyframes are global by nature — a component
       * cannot scope an @keyframes rule, and duplicating it per component is how they drift.
       *
       * tmPulse runs only while a session is actively writing, so an idle board is still.
       * tmFlash and tmBump run once, on a change.
       */
      @keyframes tmPulse {
        0%, 100% { box-shadow: var(--ds-shadow-raised); }
        50%      { box-shadow: var(--ds-shadow-raised), 0 0 0 3px var(--ds-border-accent-blue, #579dff); }
      }
      @keyframes tmFlash {
        from { background-color: var(--ds-background-selected, #e9f2ff); }
        to   { background-color: transparent; }
      }
      @keyframes tmBump {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.25); }
        100% { transform: scale(1); }
      }

      /*
       * One switch for all of it. Every animation above is redundant with something already on the
       * screen — a column, a count, a timestamp — so removing them removes no information.
       */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

  </head>

</html>
