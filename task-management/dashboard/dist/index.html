<!doctype html>
<html lang="en" data-bd-product="task-management">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>task-management board</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The window chrome follows the OS the way the board's tokens do. These two literals are
         --bd-bg-base dark/light, and are the only hex values the app may carry outside the
         vendored token file: a <meta> cannot read a custom property. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEDEF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101316" />
    <style>
      /* Paint the ground before the stylesheet arrives, so a slow load is not a white flash. */
      html { background: var(--bd-bg-base, Canvas); }
      /*
       * Motion as information (TM-040). Two jobs: show that work is happening, and show that
       * something changed. Keyframes are global by nature — a component cannot scope an
       * @keyframes rule — so they live here, on tokens.
       */
      @keyframes tmPulse {
        0%, 100% { box-shadow: var(--bd-shadow-card); }
        50%      { box-shadow: var(--bd-shadow-card), var(--bd-shadow-focus-glow); }
      }
      @keyframes tmFlash {
        from { background-color: var(--tm-accent-wash); }
        to   { background-color: transparent; }
      }
      @keyframes tmBump {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.25); }
        100% { transform: scale(1); }
      }
      /* One switch for all of it: every animation is redundant with a column, a count or a time. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
